<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัวเอง</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 3em;
            color: #007BFF;
            font-weight: bold;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2em;
            color: #6c757d;
            margin-top: 10px;
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .profile-card img {
            width: 400px;
            height: 300px;
            /* border-radius: 50%; */
            object-fit: cover;
            /* border: 5px solid #007BFF; */
            margin-bottom: 20px;
        }

        .profile-card h2 {
            font-size: 2.5em;
            color: #007BFF;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .profile-card p {
            font-size: 1.1em;
            color: #6c757d;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-links a {
            text-decoration: none;
            background-color: #007BFF;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 1.4em;
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .social-links a:hover {
            transform: translateY(-5px);
            background-color: #0056b3;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 1em;
            color: #6c757d;
        }

        @media (max-width: 768px) {
            .profile-card {
                padding: 30px 20px;
            }

            header h1 {
                font-size: 2.5em;
            }

            header p {
                font-size: 1em;
            }

            .profile-card h2 {
                font-size: 2em;
            }

            .social-links a {
                padding: 12px;
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>แนะนำตัวเอง</h1>
        <p>ยินดีที่ได้รู้จัก!</p>
    </header>

    <div class="profile-card">
        <img src="Profile.jpg" alt="Profile Picture">
