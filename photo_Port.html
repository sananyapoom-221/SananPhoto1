<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 1rem;
            transition: color 0.3s;
        }

        header nav a:hover {
            color: #f39c12;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero .slides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            animation: slideAnimation 12s infinite;
        }

        .hero .slides img {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes slideAnimation {
            0%, 16.66% {
                transform: translateX(0);
            }
            16.66%, 33.33% {
                transform: translateX(-100%);
            }
            33.33%, 49.99% {
                transform: translateX(-200%);
            }
            49.99%, 66.65% {
                transform: translateX(-300%);
            }
            66.65%, 83.31% {
                transform: translateX(-400%);
            }
            83.31%, 99.97% {
                transform: translateX(-500%);
            }
        }

        .hero .content {
            position: absolute;
            text-align: center;
            z-index: 10;
        }

        .hero .content h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #f39c12;
        }

        .hero .content p {
            font-size: 1.2rem;
        }

        .hero .content button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            background: #f39c12;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.01s;
        }

        .hero .content button:hover {
            background: #e67e22;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">My Portfolio</div>
        <nav>
            <a href="photo_Port.html" class="active">Home</a>
            <a href="Gallery.html">Gallery</a>
            <a href="about.html">about</a>
            <a href="contact.html">ติดต่อเรา</a>
            <a href="profile.html">Profile</a>
          </nav>
    </header>

    <section class="hero">
        <div class="slides">
            <img src="con1 (5).jpg" alt="Slide 1">
            <img src="IMG_9300 (730).jpg" alt="Slide 2">
            <img src="buch.jpg" alt="Slide 3">
            <img src="IMG_9300(620).jpg" alt="Slide 4">
            <img src="wedding-1 (7).jpg" alt="Slide 5">
            <img src="con1 (5).jpg" alt="Slide 6">
        </div>
        <div class="content">
            <h1>Welcome to My Portfolio</h1>
            <p>Capturing moments, one shot at a time.</p>
            <a href="Gallery.html"><button>Explore Gallery</button></a>
        </div>
    </section>
</body>
</html>
